services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops_copilot
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://ops:ops@postgres:5432/ops_copilot
      DATABASE_URL_SYNC: postgresql+psycopg://ops:ops@postgres:5432/ops_copilot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../apps/api/app:/app/app
      - ../docs/corpus:/app/corpus:ro

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:8000
      JWT_EXPIRE_MINUTES: "1440"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
